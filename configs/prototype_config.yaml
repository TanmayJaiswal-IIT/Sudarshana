# Sudarshana Prototype Token Head & Redaction Configuration

model:
  backbone: "microsoft/deberta-v3-xsmall"
  num_labels: 3
  dropout: 0.1
  hidden_size: 384
  class_weights: [1.0, 8.0, 8.0]

tokenization:
  max_length: 256
  stride: 64
  labels:
    O: 0
    B-INJ: 1
    I-INJ: 2
    pad_ignore: -100

training:
  epochs: 3
  learning_rate: 3.0e-5
  weight_decay: 0.01
  batch_size: 8
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  seeds: [42, 43, 44]

redaction:
  calibrated_threshold: 0.35
  fallback_cut_off: 0.35
  sentence_segmenter: "pysbd"
  blocked_sentinel: "[BLOCKED: PROMPT INJECTION DETECTED]"

data:
  schema: "(user_task, document, label, injection_span, attack_type)"
  train_split: "data/splits/train.jsonl"
  val_split: "data/splits/val.jsonl"
  test_split: "data/splits/test.jsonl"
  hard_negatives: "data/splits/hard_negatives.jsonl"

